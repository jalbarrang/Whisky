# Layout (indentation, line wrapping, brace placement) is owned by swift-format.
# SwiftLint owns semantics, correctness, and size. See .swift-format for the layout config.

opt_in_rules:
  - force_unwrapping
  - file_header

disabled_rules:
  # swift-format puts the opening brace on its own line when a declaration wraps.
  # Leaving this on makes the two tools rewrite each other forever.
  - opening_brace

excluded:
  # Glob, not a plain path: `swift test` creates WhiskyKit/.build, and linting
  # a dependency's source is 76 violations of someone else's style.
  - "**/.build"
  - "**/.swiftpm"
  - "**/DerivedData"

# Thresholds below were implicit defaults. They are stated explicitly because
# swift-format's wrapping changes line counts, and a silent default is a trap.
large_tuple:
  warning: 3
  error: 4

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100

file_header:
    severity: error
    required_pattern: |
                      \/\/  .*?\.swift
                      \/\/  .*?
                      \/\/
                      \/\/  This file is part of Whisky\.
                      \/\/
                      \/\/  Whisky is free software: you can redistribute it and\/or modify it under the terms
                      \/\/  of the GNU General Public License as published by the Free Software Foundation,
                      \/\/  either version 3 of the License, or \(at your option\) any later version\.
                      \/\/
                      \/\/  Whisky is distributed in the hope that it will be useful, but WITHOUT ANY WARRANTY;
                      \/\/  without even the implied warranty of MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE\.
                      \/\/  See the GNU General Public License for more details\.
                      \/\/
                      \/\/  You should have received a copy of the GNU General Public License along with Whisky\.
                      \/\/  If not, see https:\/\/www\.gnu\.org\/licenses\/\.
                      \/\/
